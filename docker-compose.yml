services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: izinhukum-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: IzinHukum
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY}"
      APP_TIMEZONE: Asia/Jakarta
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-izinhukum}"
      DB_USERNAME: "${DB_USERNAME:-izinhukum}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "${SEED_DATABASE:-false}"
      COMPANY_NAME: "PT PRAKTISI IZIN HUKUM"
      COMPANY_PHONE: "0895-4154-36593"
      COMPANY_WHATSAPP: "62895415436593"
      COMPANY_EMAIL: "izinhukum@gmail.com"
      COMPANY_ADDRESS: "Jl. Kolonel Ahmad Syam No.189, Kecamatan Jatinangor, Kabupaten Sumedang, Provinsi Jawa Barat"
      COMPANY_BANK_NAME: BCA
      COMPANY_BANK_ACCOUNT: "7405175363"
      COMPANY_BANK_HOLDER: "Muhamad Sofyan AR"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-izinhukum}"
      MARIADB_USER: "${DB_USERNAME:-izinhukum}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  app_storage:
  mariadb_data:
