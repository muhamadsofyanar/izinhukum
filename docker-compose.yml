services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: izinhukum-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_NAME: IzinHukum
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_KEY: "${APP_KEY}"
      APP_TIMEZONE: Asia/Jakarta
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-izinhukum}"
      DB_USERNAME: "${DB_USERNAME:-izinhukum}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      DB_QUEUE: "${DB_QUEUE:-default}"
      DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-300}"
      QUEUE_FAILED_DRIVER: "${QUEUE_FAILED_DRIVER:-database-uuids}"
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-smtp.mailketing.id}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-izinhukum@gmail.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-IzinHukum}"
      ORDER_NOTIFICATION_EMAIL_ENABLED: "${ORDER_NOTIFICATION_EMAIL_ENABLED:-true}"
      ORDER_NOTIFICATION_EMAIL: "${ORDER_NOTIFICATION_EMAIL:-}"
      ORDER_NOTIFICATION_WHATSAPP_ENABLED: "${ORDER_NOTIFICATION_WHATSAPP_ENABLED:-true}"
      ORDER_NOTIFICATION_WHATSAPP: "${ORDER_NOTIFICATION_WHATSAPP:-}"
      STARSENDER_ENABLED: "${STARSENDER_ENABLED:-false}"
      STARSENDER_BASE_URL: "${STARSENDER_BASE_URL:-https://api.starsender.online}"
      STARSENDER_DEFAULT_DEVICE_KEY: "${STARSENDER_DEFAULT_DEVICE_KEY:-}"
      STARSENDER_TRANSACTION_DEVICE_KEY: "${STARSENDER_TRANSACTION_DEVICE_KEY:-}"
      STARSENDER_TIMEOUT: "${STARSENDER_TIMEOUT:-20}"
      STARSENDER_CONNECT_TIMEOUT: "${STARSENDER_CONNECT_TIMEOUT:-5}"
      STARSENDER_MAX_ATTEMPTS: "${STARSENDER_MAX_ATTEMPTS:-4}"
      STARSENDER_DEFAULT_DELAY: "${STARSENDER_DEFAULT_DELAY:-2}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      SEED_DATABASE: "${SEED_DATABASE:-false}"
      COMPANY_NAME: "PT PRAKTISI IZIN HUKUM"
      COMPANY_PHONE: "0895-4154-36593"
      COMPANY_WHATSAPP: "62895415436593"
      COMPANY_EMAIL: "izinhukum@gmail.com"
      COMPANY_ADDRESS: "Jl. Kolonel Ahmad Syam No.189, Kecamatan Jatinangor, Kabupaten Sumedang, Provinsi Jawa Barat"
      COMPANY_BANK_NAME: BCA
      COMPANY_BANK_ACCOUNT: "7405175363"
      COMPANY_BANK_HOLDER: "Muhamad Sofyan AR"
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/database/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-izinhukum}"
      MARIADB_USER: "${DB_USERNAME:-izinhukum}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  app_storage:
  app_uploads:
  mariadb_data:
